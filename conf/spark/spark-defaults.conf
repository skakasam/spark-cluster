# ======================================================================================================================
# Master Configuration
# ======================================================================================================================
spark.master                                                     spark://spark-master:7077

# ======================================================================================================================
# Driver Configuration
# ======================================================================================================================
spark.driver.cores                                               2
spark.driver.memory                                              2g

# ======================================================================================================================
# Executor Configuration
# ======================================================================================================================
spark.executor.cores                                             2
spark.executor.memory                                            3g
spark.executor.instances                                         3
spark.executor.heartbeatInterval                                 20s

# ======================================================================================================================
# Network Configuration
# ======================================================================================================================
spark.network.timeout                                            120s

# ======================================================================================================================
# Application/Job Configuration
# ======================================================================================================================
spark.sql.shuffle.partitions                                     12
spark.sql.adaptive.execution.enabled                             true
spark.sql.adaptive.localShuffleReader.enabled                    true
spark.sql.adaptive.coalescePartitions.enabled                    true
spark.sql.adaptive.autoBroadcastJoinThreshold                    10m
spark.sql.session.timeZone                                       UTC
spark.sql.debug.maxToStringFields                                1000

# ======================================================================================================================
# History Server & Event Logging
# ======================================================================================================================
spark.log.level                                                  WARN
spark.eventLog.enabled                                           true
spark.eventLog.dir                                               /opt/spark/spark-events
spark.history.fs.logDirectory                                    /opt/spark/spark-events
spark.history.fs.cleaner.enabled                                 true
spark.history.fs.cleaner.interval                                1d
spark.history.fs.cleaner.maxAge                                  7d

# ======================================================================================================================
# Serialization
# ======================================================================================================================
spark.serializer                                                 org.apache.spark.serializer.KryoSerializer
spark.kryoserializer.buffer.max                                  128m

# ======================================================================================================================
# Memory management
# ======================================================================================================================
spark.memory.fraction                                            0.7
spark.memory.storageFraction                                     0.3

# ======================================================================================================================
# Shuffle optimization
# ======================================================================================================================
spark.shuffle.compress                                           true
spark.shuffle.spill.compress                                     true
spark.shuffle.file.buffer                                        64k

# ======================================================================================================================
# Dynamic allocation
# ======================================================================================================================
spark.dynamicAllocation.enabled                                  false
spark.shuffle.service.enabled                                    false

# ======================================================================================================================
# UI
# ======================================================================================================================
spark.ui.retainedJobs                                            25
spark.ui.retainedStages                                          100
spark.sql.ui.retainedExecutions                                  100

# ======================================================================================================================
# CLI
# ======================================================================================================================
spark.sql.cli.print.header                                       true

# ======================================================================================================================
# Compression
# ======================================================================================================================
spark.eventLog.compress                                          true

# ======================================================================================================================
# Delta Lake Configuration
# ======================================================================================================================
spark.sql.extensions                                             io.delta.sql.DeltaSparkSessionExtension
spark.sql.warehouse.dir                                          /opt/spark/work-dir/warehouse
spark.sql.sources.default                                        delta
spark.sql.catalog.spark_catalog                                  org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.sql.catalogImplementation                                  hive
spark.sql.legacy.createHiveTableByDefault                        false

# ======================================================================================================================
# Classpath hardening (ensures jars are visible in driver & executors across spark-submit/spark-sql)
# ======================================================================================================================
spark.driver.extraClassPath                                      /opt/spark/app-jars/*
spark.executor.extraClassPath                                    /opt/spark/app-jars/*

# ======================================================================================================================
# Ensure the dependencies folder is in the classpath
# ======================================================================================================================
spark.driver.extraJavaOptions                                    -Djava.io.tmpdir=/tmp  -Duser.home=/opt/spark/work-dir/data
spark.executor.extraJavaOptions                                  -Djava.io.tmpdir=/tmp  -Duser.home=/opt/spark/work-dir/data
